<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Payments</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>FX Payments</h1>
    <p class="note">Sample rates for demo purposes, not live market data.</p>

    <form id="payment-form">
      <label>Payee
        <input id="payee" required maxlength="100" placeholder="Acme Supplies Ltd">
      </label>
      <label>Amount
        <input id="amount" type="number" min="0.01" step="0.01" required placeholder="100.00">
      </label>
      <label>From
        <select id="from"></select>
      </label>
      <label>To
        <select id="to"></select>
      </label>
      <div class="actions">
        <button type="button" id="quote-btn">Get quote</button>
        <button type="submit">Send payment</button>
      </div>
    </form>

    <p id="quote" class="quote" hidden></p>
    <p id="error" class="error" hidden></p>

    <h2>Recent payments</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Payee</th><th>Amount</th><th>Rate</th><th>Converted</th><th>Created (UTC)</th></tr>
      </thead>
      <tbody id="payments"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
